[package]
name = "claude-jobs"
version = "0.9.0"
description = "Run headless Claude Code prompts on a schedule with launchd"
authors = ["Xavier Clavel"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "claude_jobs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = [] }
serde = { version = "1.0", features = ["derive"] }
# `preserve_order`: adding a trusted folder to `~/.claude.json` leaves the rest of the file as Claude Code wrote it.
serde_json = { version = "1.0", features = ["preserve_order"] }
# The TypeScript types in `src/domain` are generated from these structs (`pnpm domain:build`).
ts-rs = "12.0.1"
# `clock` for the local time zone: a schedule's next run is a local wall-clock time.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
plist = "1"
# `kill(pid, 0)` and `killpg`: whether a run is still alive, and stopping a timed-out one with everything it started.
libc = "0.2"
# New versions from the GitHub releases: reads `latest.json`, checks the signature, swaps the app bundle in place.
tauri-plugin-updater = "2.14.0"
# The Slack webhooks of the actions. The same reqwest and rustls (with ring) as the updater's, so nothing new is built;
# `blocking`, since a run is a plain process with no async runtime.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[dev-dependencies]
tempfile = "3.27.0"

# Proc macros and build scripts are dylibs rustc loads while compiling. Stripping them in release (Cargo's default)
# leaves dylibs dyld refuses on this toolchain ("mis-aligned LINKEDIT string pool"); they never ship in the app.
[profile.release.build-override]
strip = "none"
