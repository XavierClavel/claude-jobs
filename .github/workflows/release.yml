# Publishes the version in package.json once it reaches main: bump `version`, merge, and the installed apps offer it at
# their next check. The build is `pnpm release`, the same script as from a Mac. Needs the repository secret
# TAURI_SIGNING_PRIVATE_KEY (the content of ~/.tauri/claude-jobs.key), and TAURI_SIGNING_PRIVATE_KEY_PASSWORD if the
# key has a password. Actions are pinned to commits: this workflow holds the key every installed app trusts.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never two at once, and never one cut short halfway through publishing.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "v$version is already released: nothing to do."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.new == 'true'
    # Apple Silicon, which is the archive the README installs (Claude-Jobs_aarch64.app.tar.gz).
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release notes list the commits since the last tag.
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Without the ts-rs exports, which rewrite src/domain unformatted and would leave the tree dirty for the release.
      - run: cargo test --manifest-path src-tauri/Cargo.toml -- --skip export_bindings
      - run: pnpm release
        env:
          GH_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
