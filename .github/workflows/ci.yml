# The checks the release runs, on each pull request, so a failure shows before the merge and not when main publishes.
# Also fails when src/domain is not what `pnpm domain:build` writes from the Rust types.
name: CI

on:
  pull_request:
    branches: [main]

# A new push to the pull request stops the run of the one before.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  front:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  rust:
    # The Mac the release builds on: the app only runs on macOS.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      # For Biome, which formats the types the tests export.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Every test, export_bindings too: it writes src/domain from the Rust types.
      - run: pnpm test:rust
      - run: pnpm exec biome format --write src/domain
      - name: src/domain is up to date
        run: |
          changed=$(git status --porcelain -- src/domain)
          if [ -n "$changed" ]; then
            echo "$changed"
            echo "::error::src/domain is not what the Rust types export: run pnpm domain:build and commit it."
            exit 1
          fi
